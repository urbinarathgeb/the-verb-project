<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta
			name="description"
			content="Aprende y practica los verbos irregulares en inglés con un juego de emparejamiento contrarreloj."
		/>
		<title>The Verb Project</title>

		<!--
			Instalable como aplicación. La app ya estaba construida como juego a
			pantalla completa —viewport controlado, sin header ni footer, `h-dvh`,
			`overscroll-behavior: none`—, así que esto es la conclusión de un enfoque
			que ya se había pagado entero (`PLAN.md`, Bitácora, D13).

			**No se fija la orientación** a propósito, aunque el tablero esté pensado
			para vertical: WCAG 1.3.4 pide no restringirla salvo que sea esencial, y
			desde que el tablero se desplaza cuando no cabe, en horizontal se juega.
		-->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#f0ead6" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="The Verb" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
